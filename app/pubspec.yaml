name: nestprep
description: "NestPrep — one household on one app. NullState app `nestprep`."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  provider: ^6.1.5+1
  timezone: ^0.11.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
