name: nestprep
description: "NestPrep — one household on one app. NullState app `nestprep`."
publish_to: 'none'
version: 0.9.0+2

environment:
  sdk: ^3.13.3

dependencies:
  app_links: ^7.2.1
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cunning_document_scanner: ^3.0.3
  file_selector: ^1.0.3
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  lucide_icons_flutter: ^3.1.21
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
  assets:
    - assets/brand/
    - assets/legal/
    # The shops' own marks, shown as they are (add-to-checkers ADR-0006).
    - assets/retailers/
    # The fonts' own licences, shown on the Licences screen (accounts ADR-0005).
    - assets/fonts/DMSans-OFL.txt
    - assets/fonts/Fraunces-OFL.txt
