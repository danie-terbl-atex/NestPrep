# The native launch screen: the arch mark on the page colour, in light and dark
# (design-system ADR-0008). The colours are NestColors' canvases, so the
# splash hands over to the first Flutter frame — the session gate, which
# opens on the same mark — without a flash. Regenerate with
# `dart run flutter_native_splash:create`.
#
# AFTER REGENERATING: the tool writes values-v31/ and values-night-v31/
# styles.xml on the platform's Theme.Light/Black.NoTitleBar. Put both styles
# back on Theme.AppCompat(.Light).NoActionBar — MainActivity is a
# FlutterFragmentActivity and will not start otherwise on Android 12+.
# test/app/android_launch_themes_test.dart fails until you do. It also
# re-indents ios/Runner/Info.plist to add UIStatusBarHidden=false, which is
# the default and can be dropped.
flutter_native_splash:
  color: "#FFF8ED"
  color_dark: "#211A20"
  image: "assets/brand/launcher/splash_mark.png"
  android_12:
    image: "assets/brand/launcher/splash_android12.png"
    color: "#FFF8ED"
    color_dark: "#211A20"
  android: true
  ios: true
  web: false
