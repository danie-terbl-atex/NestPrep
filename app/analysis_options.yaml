# Tightened beyond flutter_lints (`ENG-16`). Run `flutter analyze --fatal-infos`:
# every diagnostic is a build failure. Generated files are excluded (`ENG-24`).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_catches_without_on_clauses
    - avoid_dynamic_calls
    - avoid_redundant_argument_values
    - cancel_subscriptions
    - directives_ordering
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
