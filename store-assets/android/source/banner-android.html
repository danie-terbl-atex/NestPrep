<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Fraunces; src: url(assets/fonts/Fraunces-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: "DM Sans"; src: url(assets/fonts/DMSans-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: "DM Sans"; src: url(assets/fonts/DMSans-Bold.ttf); font-weight: 700; }
:root { --oat:#FFF8ED; --ink:#35252E; --guava:#F57B91; --butter:#F3D886; --lilac:#C9BCE8; --sage:#C4D4BF; --blush:#FCDDE2; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--guava); }
.scene { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: scale(var(--k)); }
.blob { position: absolute; border-radius: 50%; background: var(--c); }
.copy { position: absolute; left: -680px; top: -300px; width: 860px; color: var(--ink); }
.eyebrow { font: 700 30px/1 "DM Sans"; letter-spacing: .18em; text-transform: uppercase; color: var(--oat); margin-bottom: 30px; display: flex; gap: 16px; align-items: center; }
.eyebrow::before { content: ""; width: 48px; height: 6px; border-radius: 3px; background: var(--oat); }
h1 { font: 600 132px/1.02 Fraunces; letter-spacing: -.022em; white-space: nowrap; }
h1 em { font-style: normal; color: var(--oat); }
.tags { margin-top: 44px; display: flex; gap: 14px; flex-wrap: wrap; width: 760px; }
.tags span { font: 600 30px/1 "DM Sans"; padding: 18px 28px; border-radius: 999px; background: rgba(255,248,237,.92); color: var(--ink); }
.stage { position: absolute; left: var(--px); top: var(--py); width: 0; height: 0; perspective: 3200px; }
.rig { position: absolute; --s: calc(var(--pw) / 1206); left: calc(var(--pw) * -0.5px); top: calc(var(--pw) * -1.087px); width: calc(var(--pw) * 1px); height: calc(var(--pw) * 2.174px); transform-style: preserve-3d; transform: rotateY(var(--ry, -10deg)) rotateX(var(--rx, 5deg)) rotateZ(var(--rz, 2deg)); }
.phone { position: absolute; inset: calc(var(--pw) * -0.0227px); border-radius: calc(var(--pw) * 0.127px); background: #1B1618; box-shadow: 0 0 0 3px #5a4a50 inset, 0 70px 110px rgba(20,8,14,.42), 0 24px 40px rgba(20,8,14,.26); }
.phone::after { content: ""; position: absolute; inset: calc(var(--pw) * 0.0227px); border-radius: calc(var(--pw) * 0.107px); background: url(statusbar.svg) top center / 100% auto no-repeat, var(--img) top center / 100% auto no-repeat; }
.pop { position: absolute; background-image: var(--img); background-repeat: no-repeat;
  left: calc(var(--x) * 3px * var(--s)); top: calc(var(--y) * 3px * var(--s)); width: calc(var(--w) * 3px * var(--s)); height: calc(var(--h) * 3px * var(--s));
  background-size: calc(1206px * var(--s)) auto; background-position: calc(var(--x) * -3px * var(--s)) calc(var(--y) * -3px * var(--s));
  border-radius: calc(var(--r, 24) * 3px * var(--s));
  transform: translate3d(var(--dx, 0px), var(--dy, 0px), var(--z, 130px)) scale(var(--sc, 1.16)) rotateZ(var(--tilt, 0deg));
  box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 40px 70px rgba(24,10,16,.42), 0 10px 20px rgba(24,10,16,.22); }
.sticker { position: absolute; width: var(--d, 180px); height: var(--d, 180px); margin: calc(var(--d, 180px) / -2); border-radius: var(--rad, 50%); background: var(--c, #fff) var(--img) center / cover no-repeat; transform: rotate(var(--tilt, 0deg)); box-shadow: 0 0 0 7px #fff, 0 30px 50px rgba(24,10,16,.34); }
</style></head><body>

<script>
  const q = new URLSearchParams(location.search);
  const sc=document.getElementById('scene'); sc.style.setProperty('--k', q.get('k') || '1'); sc.style.setProperty('--oy', (q.get('oy')||'0')+'px');
  if (q.get('safe')) { const [x,y,w,h] = q.get('safe').split(',').map(Number); const d = document.createElement('div'); d.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;outline:6px dashed #00e5ff;z-index:99`; document.body.appendChild(d); }
